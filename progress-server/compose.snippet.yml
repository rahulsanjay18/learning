# Add under `services:` in your existing docker-compose.yml, next to book-server (same pattern as book-server/compose.snippet.yml).
# The Tailscale sidecar proxies https://books.tail59e10.ts.net/progress -> http://127.0.0.1:8089 (see serve.json.example).
  progress-server:
    build: ./progress-server
    restart: unless-stopped
    environment:
      PROGRESS_TEACHER_TOKEN: ${BOOKS_TOKEN}   # same token the cloud environment already injects for this hostname
      PROGRESS_DB: /data/progress.db
      PROGRESS_ORIGINS: https://rahulsanjay18.github.io
    network_mode: service:ts-books            # share the Tailscale sidecar's network, like book-server does
    depends_on: [ts-books]
    # No ports: section. Docker refuses to publish ports with network_mode: service:... ("conflicting options").
    volumes:
      - ./progress-server/data:/data          # writable; back this folder up (it's your learning history)
